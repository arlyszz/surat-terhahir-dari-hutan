<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Surat Terakhir dari Hutan</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#000;color:#e6ddcc;
  font-family:Georgia,'Times New Roman',serif;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
/* FIX #1: #ui wajib punya z-index di atas #menu (40) agar modal tampil di atas menu */
#ui{position:fixed;inset:0;pointer-events:none;z-index:50}
#ui>*{pointer-events:auto}
.hide{display:none!important}

#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
  align-items:center;padding:12px 16px;font-family:system-ui,-apple-system,sans-serif;
  font-size:10px;letter-spacing:.24em;color:#8d8171;text-transform:uppercase;
  background:linear-gradient(180deg,rgba(0,0,0,.65),transparent);z-index:10}
#hud button{background:transparent;border:1px solid #3a3226;color:#a99b86;
  font-family:inherit;font-size:9px;letter-spacing:.2em;padding:7px 12px;border-radius:3px;
  cursor:pointer;margin-left:8px;transition:.2s}
#hud button:hover{background:#221c15;color:#e6ddcc;border-color:#6b5a3f}

#textbox{position:absolute;left:50%;transform:translateX(-50%);bottom:4%;
  width:min(760px,92vw);background:linear-gradient(180deg,rgba(14,12,9,.94),rgba(7,6,5,.97));
  border:1px solid #38301f;border-radius:4px;padding:16px 20px 24px;cursor:pointer;
  box-shadow:0 14px 50px rgba(0,0,0,.8);z-index:12}
#who{font-family:system-ui,sans-serif;font-size:10px;letter-spacing:.26em;color:#c58b4a;
  margin-bottom:8px;text-transform:uppercase;min-height:12px}
#txt{font-size:17px;line-height:1.78;color:#ded4c0;min-height:3.2em;letter-spacing:.01em}
#hintNext{position:absolute;right:14px;bottom:7px;font-family:system-ui,sans-serif;
  font-size:9px;letter-spacing:.2em;color:#6d6353;animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
@media(max-width:600px){#txt{font-size:15px;line-height:1.7}#textbox{padding:13px 15px 22px}}

#choices{position:absolute;left:50%;transform:translateX(-50%);bottom:10%;
  width:min(680px,92vw);display:flex;flex-direction:column;gap:9px;z-index:13}
.cq{font-family:system-ui,sans-serif;font-size:11px;letter-spacing:.18em;color:#8d8171;
  text-transform:uppercase;margin-bottom:6px;text-align:center}
.choice{background:rgba(18,15,11,.94);border:1px solid #3a3226;color:#d6cbb6;
  font-family:Georgia,serif;font-size:15px;line-height:1.5;padding:14px 18px;border-radius:4px;
  cursor:pointer;text-align:left;transition:.18s}
.choice:hover{background:#221c15;border-color:#7d6742;color:#f0e7d5;transform:translateX(3px)}

/* FIX #1: #overlay z-index 60 (di atas #card 30, dan di atas #menu 40) */
#overlay{position:absolute;inset:0;background:rgba(4,4,3,.9);display:flex;align-items:center;
  justify-content:center;padding:16px;z-index:60;overflow:auto}
.modal{background:#12100d;border:1px solid #3a3226;border-radius:6px;padding:22px;
  width:min(680px,94vw);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.9)}
.modal h2{font-size:19px;font-weight:normal;letter-spacing:.06em;color:#e3d8c2;margin-bottom:6px}
.modal .hint{font-family:system-ui,sans-serif;font-size:12px;line-height:1.65;color:#8d8171;
  margin-bottom:16px;border-left:2px solid #4a3d28;padding-left:10px}
.modal .close{float:right;background:none;border:none;color:#6d6353;font-size:22px;cursor:pointer;
  line-height:1;padding:0 4px}
.modal .close:hover{color:#e6ddcc}

.pbtn{background:#1c1811;border:1px solid #3f3626;color:#d6cbb6;font-family:Georgia,serif;
  font-size:14px;padding:11px 14px;border-radius:4px;cursor:pointer;transition:.15s;text-align:left;
  line-height:1.45;width:100%}
.pbtn:hover{background:#262019;border-color:#6b5a3f}
.pbtn.good{background:#1e2a1a;border-color:#5a7a44;color:#b7d2a1}
.pbtn.bad{background:#2a1614;border-color:#7a3b34;color:#e0a49c;animation:shake .32s}
.pbtn.done{opacity:.35;pointer-events:none;border-color:#3f3626}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}
  75%{transform:translateX(5px)}}
.col{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.two{display:flex;gap:10px}
@media(max-width:520px){.two{flex-direction:column}}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.key{width:52px;height:52px;background:#1c1811;border:1px solid #3f3626;color:#e0d6c2;
  font-family:system-ui,sans-serif;font-size:17px;border-radius:4px;cursor:pointer}
.key:hover{background:#2a231a}
.disp{display:flex;gap:10px;justify-content:center;margin:6px 0 18px}
.slot{width:44px;height:56px;border-bottom:2px solid #5a4a33;display:flex;align-items:center;
  justify-content:center;font-family:system-ui,sans-serif;font-size:26px;color:#e6ddcc}
.photogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;max-width:330px;margin:0 auto}
.photogrid canvas{width:100%;aspect-ratio:4/3;display:block;border:1px solid #2a2419;
  border-radius:2px;cursor:pointer;background:#000}
.photogrid canvas.sel{outline:2px solid #c58b4a;outline-offset:2px}
.pathgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:300px;margin:0 auto}
.cell{aspect-ratio:1;background:#1a1710;border:1px solid #322b1e;border-radius:3px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:10px;color:#5a5142;
  font-family:system-ui,sans-serif}
.cell.rock{background:#0e0c09;border-color:#181410;cursor:not-allowed;color:#241f18}
.cell.on{background:#3d5a34;border-color:#6f9a5c}
.cell.st{background:#5a4a2a;border-color:#c58b4a;color:#e8d5b0}
.cell.en{background:#2a4a5a;border-color:#5a9ac0;color:#c0e0f0}
.btnrow{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.gbtn{background:#2a231a;border:1px solid #6b5a3f;color:#e6ddcc;font-family:system-ui,sans-serif;
  font-size:11px;letter-spacing:.18em;padding:11px 20px;border-radius:3px;cursor:pointer;
  text-transform:uppercase}
.gbtn:hover{background:#3a3124}
.fb{text-align:center;font-family:system-ui,sans-serif;font-size:12px;color:#9c8e78;
  margin-top:14px;min-height:18px;letter-spacing:.06em}

.paper{background:linear-gradient(170deg,#e5dcc4,#d3c8ad);color:#2a241a;padding:26px 24px;
  border-radius:2px;font-size:15px;line-height:1.85;box-shadow:inset 0 0 60px rgba(120,100,70,.35),
  0 18px 50px rgba(0,0,0,.85);position:relative;max-height:64vh;overflow:auto;white-space:pre-wrap}
.paper::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 18% 12%,rgba(160,140,100,.22),transparent 45%),
  radial-gradient(circle at 82% 88%,rgba(140,120,85,.22),transparent 45%)}
.paper h3{font-size:14px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px;
  color:#5a4a33;font-weight:normal;font-family:system-ui,sans-serif}

#menu{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:7px;background:radial-gradient(circle at 50% 38%,#1a1611,#050403 72%)}
#menu h1{font-size:clamp(26px,6vw,46px);letter-spacing:.1em;font-weight:normal;color:#e9dfc8;
  text-align:center;text-shadow:0 0 40px rgba(197,139,74,.25);margin-bottom:2px}
#menu .tag{font-family:system-ui,sans-serif;font-size:11px;letter-spacing:.2em;color:#7a6f5e;
  text-align:center;margin-bottom:26px;max-width:88vw;line-height:1.8;font-style:italic}
.mbtn{background:transparent;border:none;border-bottom:1px solid transparent;color:#a99b86;
  font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.28em;padding:11px 26px;
  cursor:pointer;text-transform:uppercase;transition:.22s;width:260px;max-width:80vw}
.mbtn:hover{color:#f0e7d5;border-bottom-color:#6b5a3f;letter-spacing:.34em}
.mbtn:disabled{opacity:.28;cursor:default;letter-spacing:.28em;border-bottom-color:transparent}
#menuFoot{position:absolute;bottom:16px;font-family:system-ui,sans-serif;font-size:9px;
  letter-spacing:.22em;color:#3f382c;text-align:center}

#cutcap{position:absolute;left:50%;transform:translateX(-50%);bottom:12%;width:min(700px,90vw);
  text-align:center;font-size:17px;line-height:1.8;color:#e2d8c4;text-shadow:0 2px 18px #000;
  z-index:15;pointer-events:none;padding:0 10px}
#skip{position:absolute;right:18px;bottom:18px;background:rgba(0,0,0,.5);border:1px solid #3a3226;
  color:#a99b86;font-family:system-ui,sans-serif;font-size:9px;letter-spacing:.22em;padding:8px 14px;
  border-radius:3px;cursor:pointer;z-index:16;text-transform:uppercase}

#card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;background:#050403;z-index:30;transition:opacity .7s;text-align:center;padding:20px}
#card .n{font-family:system-ui,sans-serif;font-size:10px;letter-spacing:.4em;color:#8a6a3a;margin-bottom:16px}
#card .t{font-size:clamp(20px,4.5vw,32px);letter-spacing:.14em;color:#e9dfc8}
#card .s{font-family:system-ui,sans-serif;font-size:11px;letter-spacing:.22em;color:#6d6353;
  margin-top:16px;text-transform:uppercase}

#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:22%;width:min(560px,88vw);
  background:rgba(12,10,8,.94);border:1px solid #3a3226;border-left:2px solid #c58b4a;
  padding:13px 16px;font-size:14px;line-height:1.65;color:#d6cbb6;border-radius:3px;
  z-index:14;opacity:0;transition:opacity .4s;pointer-events:none}
#toast.on{opacity:1}

#exploreHint{position:absolute;top:52px;left:50%;transform:translateX(-50%);
  font-family:system-ui,sans-serif;font-size:10px;letter-spacing:.24em;color:#a99b86;
  background:rgba(8,7,6,.75);padding:8px 16px;border-radius:20px;z-index:11;text-transform:uppercase}
.arch{display:flex;flex-direction:column;gap:8px}
.architem{background:#1a1710;border:1px solid #332c1f;border-radius:4px;padding:12px 14px;
  cursor:pointer;font-family:system-ui,sans-serif;font-size:12px;color:#c0b4a0;letter-spacing:.06em}
.architem:hover{background:#241e15;border-color:#6b5a3f}
.architem.locked{opacity:.35;cursor:default}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;
  border-bottom:1px solid #241f18;font-family:system-ui,sans-serif;font-size:12px;color:#b8ac97;
  letter-spacing:.08em}
input[type=range]{width:150px;accent-color:#c58b4a}
.toggle{background:#1c1811;border:1px solid #3f3626;color:#a99b86;padding:6px 14px;
  border-radius:3px;cursor:pointer;font-family:system-ui,sans-serif;font-size:11px;letter-spacing:.14em}
.toggle.on{background:#3d5a34;border-color:#6f9a5c;color:#d8f0c8}
.cred{font-family:system-ui,sans-serif;font-size:12px;line-height:2;color:#9c8e78}
.cred b{color:#d6cbb6;font-weight:normal;letter-spacing:.1em}
.endstat{font-family:system-ui,sans-serif;font-size:11px;letter-spacing:.14em;color:#8d8171;
  line-height:2.1;margin:16px 0;border-top:1px solid #241f18;border-bottom:1px solid #241f18;padding:12px 0}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="ui">
  <div id="hud" class="hide">
    <div><span id="chLabel"></span></div>
    <div>
      <button id="btnArchive">ARSIP</button>
      <button id="btnPause">JEDA</button>
    </div>
  </div>

  <div id="exploreHint" class="hide">Klik objek yang bisa diperiksa</div>

  <div id="textbox" class="hide">
    <div id="who"></div>
    <div id="txt"></div>
    <div id="hintNext">KLIK / SPASI ▸</div>
  </div>

  <div id="choices" class="hide"></div>
  <div id="toast"></div>
  <div id="cutcap" class="hide"></div>
  <button id="skip" class="hide">LEWATI ▸▸</button>
  <div id="overlay" class="hide"></div>

  <div id="card" class="hide">
    <div class="n"></div>
    <div class="t"></div>
    <div class="s"></div>
  </div>
</div>

<div id="menu">
  <h1>SURAT TERAKHIR<br>DARI HUTAN</h1>
  <div class="tag">"Ketika hutan kehilangan suaranya,<br>siapa yang masih mau mendengarkan?"</div>
  <button class="mbtn" id="mStart">MULAI CERITA</button>
  <button class="mbtn" id="mCont">LANJUTKAN</button>
  <button class="mbtn" id="mArch">ARSIP SURAT</button>
  <button class="mbtn" id="mGal">GALERI KENANGAN</button>
  <button class="mbtn" id="mSet">PENGATURAN</button>
  <button class="mbtn" id="mCred">KREDIT</button>
  <div id="menuFoot">SEBUAH KISAH FIKSI · TIDAK ADA KARAKTER ATAU PERUSAHAAN NYATA</div>
</div>

<script>
"use strict";
/* =========================================================================
   SURAT TERAKHIR DARI HUTAN — FIXED VERSION
   Fixes:
   1. #ui z-index:50 (modals tampil di atas menu)
   2. #overlay z-index:60 (modals di atas #card)
   3. p8 cipher QHMB → QHLAZ (decode: RIMBA)
   4. Cutscene dari galeri: menu di-hide sementara
   5. Tombol × pada puzzle: kirim ke menu (save + showMenu)
   ========================================================================= */

const D = document;
const $ = s => D.querySelector(s);
const el = (t, c, txt) => { const e = D.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);

const VW = 480, VH = 270;
const cv = $('#cv'), ctx = cv.getContext('2d');
let DPR = 1, SCALE = 1, OFFX = 0, OFFY = 0;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const W = window.innerWidth, H = window.innerHeight;
  cv.width = Math.floor(W * DPR);
  cv.height = Math.floor(H * DPR);
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  SCALE = Math.min(W / VW, H / VH);
  OFFX = (W - VW * SCALE) / 2;
  OFFY = (H - VH * SCALE) / 2;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

const Sound = {
  ctx: null, master: null, musicGain: null, sfxGain: null,
  vol: 0.55, muted: false, musicOn: true,
  droneNodes: [], musicTimer: null, ready: false,
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { return; }
    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : this.vol;
    this.master.connect(this.ctx.destination);
    this.musicGain = this.ctx.createGain();
    this.musicGain.gain.value = 0.22;
    this.musicGain.connect(this.master);
    this.sfxGain = this.ctx.createGain();
    this.sfxGain.gain.value = 0.45;
    this.sfxGain.connect(this.master);
    this.ready = true;
    this.startDrone();
    this.scheduleMusic();
  },
  resume() {
    if (!this.ctx) this.init();
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  setVolume(v) { this.vol = v; if (this.master) this.master.gain.value = this.muted ? 0 : v; },
  startDrone() {
    if (!this.ctx) return;
    [55, 82.5, 110].forEach((f, i) => {
      const o = this.ctx.createOscillator();
      o.type = i === 2 ? 'triangle' : 'sine';
      o.frequency.value = f;
      const g = this.ctx.createGain(); g.gain.value = 0.0;
      const filt = this.ctx.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 420;
      const lfo = this.ctx.createOscillator();
      lfo.frequency.value = 0.03 + i * 0.017;
      const lfoGain = this.ctx.createGain(); lfoGain.gain.value = 0.018;
      lfo.connect(lfoGain); lfoGain.connect(g.gain); lfo.start();
      g.gain.setTargetAtTime(0.03 / (i + 1), this.ctx.currentTime, 3);
      o.connect(filt); filt.connect(g); g.connect(this.musicGain);
      o.start(); this.droneNodes.push(o, lfo);
    });
  },
  piano(freq, dur, when, gain) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + (when || 0);
    const o = this.ctx.createOscillator(), o2 = this.ctx.createOscillator();
    const g = this.ctx.createGain(), f = this.ctx.createBiquadFilter();
    o.type = 'sine'; o.frequency.value = freq;
    o2.type = 'triangle'; o2.frequency.value = freq * 2.003;
    f.type = 'lowpass'; f.frequency.value = 1800;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain || 0.09, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); o2.connect(f); f.connect(g); g.connect(this.musicGain);
    o.start(t); o2.start(t);
    o.stop(t + dur + 0.1); o2.stop(t + dur + 0.1);
  },
  scheduleMusic() {
    if (this.musicTimer) clearTimeout(this.musicTimer);
    const scale = [220, 261.6, 293.7, 329.6, 392, 440, 523.3];
    const play = () => {
      if (this.ctx && !this.muted && this.musicOn) {
        const n = 1 + Math.floor(Math.random() * 3);
        for (let i = 0; i < n; i++) {
          const f = scale[Math.floor(Math.random() * scale.length)] / (Math.random() < 0.35 ? 2 : 1);
          this.piano(f, rand(2.4, 4.6), i * rand(0.4, 1.1), rand(0.035, 0.075));
        }
      }
      this.musicTimer = setTimeout(play, rand(4200, 8500));
    };
    this.musicTimer = setTimeout(play, 1500);
  },
  blip(freq, dur, type, vol) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol || 0.1, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.15));
    o.connect(g); g.connect(this.sfxGain);
    o.start(t); o.stop(t + (dur || 0.15) + 0.05);
  },
  click() { this.blip(640, 0.06, 'square', 0.045); },
  paper() { this.blip(280, 0.12, 'sawtooth', 0.03); },
  success() { this.blip(523.3, 0.22, 'sine', 0.1); setTimeout(() => this.blip(784, 0.35, 'sine', 0.08), 110); },
  fail() { this.blip(150, 0.3, 'triangle', 0.09); },
  low() { this.blip(98, 0.9, 'sine', 0.13); },
  breath() { this.blip(196, 0.5, 'sine', 0.05); }
};

const SAVE_KEY = 'sltr_save_v1';
const state = {
  chapter: 1, step: 0, scene: 'rumah',
  letters: [], puzzles: [], evidence: 0, trust: 0, env: 0,
  flags: {}, endings: [], hotspots: null, exploreNeed: 0, started: false
};
const settings = { textSpeed: 42, volume: 0.55, muted: false, music: true, reduceMotion: false };

let storageOK = true;
try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); }
catch (e) { storageOK = false; }

function save() {
  if (!storageOK) return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      chapter: state.chapter, step: state.step, scene: state.scene,
      letters: state.letters, puzzles: state.puzzles, evidence: state.evidence,
      trust: state.trust, env: state.env, flags: state.flags,
      endings: state.endings, started: state.started, settings: settings
    }));
  } catch (e) {}
}
function loadSave() {
  if (!storageOK) return null;
  try { const raw = localStorage.getItem(SAVE_KEY); return raw ? JSON.parse(raw) : null; }
  catch (e) { return null; }
}
function applySave(d) {
  state.chapter = d.chapter || 1;
  state.step = d.step || 0;
  state.scene = d.scene || 'rumah';
  state.letters = d.letters || [];
  state.puzzles = d.puzzles || [];
  state.evidence = d.evidence || 0;
  state.trust = d.trust || 0;
  state.env = d.env || 0;
  state.flags = d.flags || {};
  state.endings = d.endings || [];
  state.started = true;
  if (d.settings) Object.assign(settings, d.settings);
}

let particles = [];
function spawnParticles(dt) {
  const s = state.scene;
  let kind = null, rate = 0;
  if (s === 'rumah' || s === 'pengungsian' || s === 'jalan' || s === 'sungai') { kind = 'rain'; rate = 55; }
  else if (s === 'hutanBakar') { kind = 'ember'; rate = 16; }
  else if (s === 'kebunSawit' || s === 'bukit') { kind = 'dust'; rate = 4; }
  if (!kind || particles.length > 140) return;
  if (Math.random() < rate * dt) {
    if (kind === 'rain') particles.push({ k: 'rain', x: rand(-20, VW + 20), y: -8, vy: rand(180, 260), vx: rand(-22, -10), life: 3, max: 3 });
    else if (kind === 'ember') particles.push({ k: 'ember', x: rand(0, VW), y: rand(120, VH), vy: rand(-26, -8), vx: rand(-12, 12), life: rand(2, 5), max: 5, s: rand(0.8, 2.2) });
    else particles.push({ k: 'dust', x: rand(0, VW), y: rand(40, VH), vy: rand(-6, 3), vx: rand(-6, 6), life: rand(3, 7), max: 7, s: rand(0.5, 1.4) });

}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0 || p.y > VH + 20 || p.y < -30 || p.x < -40 || p.x > VW + 40) particles.splice(i, 1);
  }
}
function drawParticles() {
  for (const p of particles) {
    const a = clamp(p.life / p.max, 0, 1);
    if (p.k === 'rain') {
      ctx.strokeStyle = 'rgba(150,175,190,' + (a * 0.35).toFixed(3) + ')';
      ctx.lineWidth = 1; ctx.beginPath();
      ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.vx * 0.05, p.y + p.vy * 0.05); ctx.stroke();
    } else if (p.k === 'ember') {

    } else {
      ctx.fillStyle = 'rgba(180,170,150,' + (a * 0.22).toFixed(2) + ')';
      ctx.fillRect(p.x, p.y, p.s, p.s);
    }
  }
}

function rr(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x | 0, y | 0, w | 0, h | 0); }
function cc(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill(); }
function lg(x0, y0, x1, y1, stops) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  for (const s of stops) g.addColorStop(s[0], s[1]);
  return g;
}
function skyGrad(c1, c2) { ctx.fillStyle = lg(0, 0, 0, VH, [[0, c1], [1, c2]]); ctx.fillRect(0, 0, VW, VH); }
function person(x, y, s, c) {
  ctx.fillStyle = c;
  ctx.fillRect(Math.round(x - 2 * s), Math.round(y - 11 * s), Math.round(4 * s), Math.round(11 * s));
  ctx.beginPath(); ctx.arc(x, y - 13.5 * s, 3 * s, 0, 6.2832); ctx.fill();
}
function deadTree(x, y, h, c) {
  ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.beginPath();
  ctx.moveTo(x, y); ctx.lineTo(x, y - h);
  ctx.moveTo(x, y - h * 0.6); ctx.lineTo(x - h * 0.28, y - h * 0.85);
  ctx.moveTo(x, y - h * 0.75); ctx.lineTo(x + h * 0.3, y - h * 0.95);
  ctx.moveTo(x, y - h * 0.35); ctx.lineTo(x + h * 0.22, y - h * 0.5);
  ctx.stroke();
}
function palm(x, y, h, c) {
  ctx.strokeStyle = c; ctx.lineWidth = 1.6; ctx.beginPath();
  ctx.moveTo(x, y); ctx.lineTo(x + 2, y - h); ctx.stroke();
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI * 0.5 + (i - 2) * 0.55;
    ctx.beginPath();
    ctx.moveTo(x + 2, y - h);
    ctx.quadraticCurveTo(x + 2 + Math.cos(a) * 12, y - h - 6 + Math.sin(a) * 4, x + 2 + Math.cos(a) * 20, y - h + Math.sin(a) * 10);
    ctx.stroke();
  }
}

let lastT = 0, timeAcc = 0;
function render(now) {
  const t = now / 1000;
  const dt = lastT ? Math.min(0.06, t - lastT) : 0.016;
  lastT = t; timeAcc += dt;
  updateTypewriter(dt); updateParticles(dt); spawnParticles(dt); updateCutscene(dt);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(DPR * SCALE, 0, 0, DPR * SCALE, DPR * OFFX, DPR * OFFY);
  ctx.imageSmoothingEnabled = false;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, VW, VH); ctx.clip();
  const fn = Scenes[state.scene] || Scenes.rumah;
  fn(timeAcc);
  drawParticles();
  drawHotspots(timeAcc);
  ctx.restore();
  requestAnimationFrame(render);
}

function drawHotspots(t) {
  if (!state.hotspots) return;
  for (const h of state.hotspots) {
    if (h.found) continue;
    const pulse = (Math.sin(t * 3) * 0.5 + 0.5);
    ctx.strokeStyle = 'rgba(220,180,110,' + (0.35 + pulse * 0.4).toFixed(2) + ')';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(h.x, h.y, h.r * (0.85 + pulse * 0.15), 0, 6.2832); ctx.stroke();
    ctx.fillStyle = 'rgba(220,180,110,' + (0.10 + pulse * 0.12).toFixed(2) + ')';
    ctx.beginPath(); ctx.arc(h.x, h.y, h.r * 0.5, 0, 6.2832); ctx.fill();
  }
}

cv.addEventListener('click', e => {
  if (!state.hotspots) return;
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left - OFFX) / SCALE;
  const y = (e.clientY - r.top - OFFY) / SCALE;
  for (const h of state.hotspots) {
    if (h.found) continue;
    const dx = x - h.x, dy = y - h.y;
    if (dx * dx + dy * dy <= h.r * h.r) {
      h.found = true; Sound.paper(); toast(h.txt);
      if (state.hotspots.every(q => q.found)) {
        if (state.hotspots.filter(q => q.found).length >= state.exploreNeed) {
          state.hotspots = null;
          $('#exploreHint').classList.add('hide');
          setTimeout(() => { if (state.hotspots === null) advance(); }, 900);
        }
      }
      break;
    }
  }
});

let tw = { active: false, i: 0, text: '', cps: 42, onDone: null };
const tbEl = $('#textbox'), whoEl = $('#who'), txtEl = $('#txt');

function showNarr(who, text, cb) {
  Sound.resume();
  tbEl.classList.remove('hide');
  $('#choices').classList.add('hide');
  whoEl.textContent = who || '';
  txtEl.textContent = '';
  const cps = settings.reduceMotion ? 9999 : Math.max(8, settings.textSpeed);
  tw = { active: true, i: 0, text: text, cps: cps, onDone: cb };
  if (cps >= 9999) finishType();
}
function updateTypewriter(dt) {
  if (!tw.active) return;
  tw.i += dt * tw.cps;
  if (tw.i >= tw.text.length) { finishType(); return; }
  txtEl.textContent = tw.text.slice(0, Math.floor(tw.i));
}
function finishType() { tw.active = false; txtEl.textContent = tw.text; }
function hideText() { tbEl.classList.add('hide'); tw.active = false; }
tbEl.addEventListener('click', () => {
  if (tw.active) { finishType(); return; }
  hideText();
  const cb = tw.onDone; tw.onDone = null;
  if (cb) cb();
});

let toastTimer = null;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 3800);
}

function showChoice(question, opts) {
  hideText();
  const box = $('#choices');
  box.innerHTML = '';
  if (question) box.appendChild(el('div', 'cq', question));
  opts.forEach(o => {
    const b = el('button', 'choice', o.txt);
    b.onclick = () => {
      Sound.click();
      box.classList.add('hide'); box.innerHTML = '';
      if (o.fx) o.fx();
      advance();
    };
    box.appendChild(b);
  });
  box.classList.remove('hide');
}

function addLetter(id) { if (!state.letters.includes(id)) state.letters.push(id); state.evidence += 1; }

function showLetter(id, cb) {
  Sound.resume(); Sound.paper(); hideText();
  const L = LETTERS[id];
  const ov = $('#overlay'); ov.innerHTML = '';
  const m = el('div', 'modal');
  const paper = el('div', 'paper');
  paper.appendChild(el('h3', null, L.title));
  const bodyEl = el('div', null, '');
  paper.appendChild(bodyEl);
  m.appendChild(paper);
  const br = el('div', 'btnrow');
  const b = el('button', 'gbtn', 'LIPAT SURAT');
  b.onclick = () => { Sound.click(); ov.classList.add('hide'); ov.innerHTML = ''; if (cb) cb(); };
  br.appendChild(b); m.appendChild(br); ov.appendChild(m); ov.classList.remove('hide');
  let i = 0;
  const text = L.body;
  const speed = settings.reduceMotion ? 9999 : Math.max(12, settings.textSpeed * 1.6);
  if (speed >= 9999) { bodyEl.textContent = text; return; }
  const iv = setInterval(() => {
    i += 3; bodyEl.textContent = text.slice(0, i);
    if (i >= text.length) { clearInterval(iv); bodyEl.textContent = text; }
  }, 1000 / (speed / 3));
  paper.addEventListener('click', () => { clearInterval(iv); bodyEl.textContent = text; }, { once: true });
}

let cut = null;
function playCut(id, cb) {
  const c = CUTS[id];
  if (!c) { if (cb) cb(); return; }
  hideText();
  $('#choices').classList.add('hide');
  cut = { frames: c.frames, i: 0, t: 0, cb: cb };
  state.scene = c.frames[0].scene;
  $('#cutcap').textContent = c.frames[0].cap;
  $('#cutcap').classList.remove('hide');
  $('#skip').classList.remove('hide');
  Sound.breath();
}
function updateCutscene(dt) {
  if (!cut) return;
  cut.t += dt;
  const f = cut.frames[cut.i];
  if (cut.t >= f.dur) {
    cut.t = 0; cut.i++;
    if (cut.i >= cut.frames.length) { endCut(); return; }
    const nf = cut.frames[cut.i];
    state.scene = nf.scene;
    $('#cutcap').textContent = nf.cap;
    particles = particles.filter(p => p.k !== 'rain');
  }
}
function endCut() {
  const cb = cut ? cut.cb : null;
  cut = null;
  $('#cutcap').classList.add('hide');
  $('#skip').classList.add('hide');
  if (cb) cb();
}
$('#skip').addEventListener('click', () => { Sound.click(); endCut(); });

function openPuzzle(id, onSolve) {
  Sound.resume(); hideText(); $('#choices').classList.add('hide');
  const def = PUZZLES[id];
  if (!def) { onSolve(); return; }
  const ov = $('#overlay'); ov.innerHTML = '';
  const m = el('div', 'modal');
  m.appendChild(el('h2', null, def.title));
  m.appendChild(el('div', 'hint', def.hint));
  const body = el('div'); m.appendChild(body);
  const fb = el('div', 'fb', ''); m.appendChild(fb);
  ov.appendChild(m); ov.classList.remove('hide');

  // FIX: tombol close (×) tidak mematikan puzzle tanpa menyelesaikan
  // Pemain harus menyelesaikan untuk lanjut. Progres auto-save, jadi reload aman.
  def.build(body, fb, () => {
    Sound.success();
    state.evidence += 1;
    if (!state.puzzles.includes(id)) state.puzzles.push(id);
    fb.textContent = 'Berhasil.';
    setTimeout(() => { ov.classList.add('hide'); ov.innerHTML = ''; onSolve(); }, 850);
  }, (msg) => { fb.textContent = msg; });
}

function buildCode(root, answer, onSolve, onFail) {
  let val = '';
  const disp = el('div', 'disp'); const slots = [];
  for (let i = 0; i < answer.length; i++) { const s = el('div', 'slot', ''); slots.push(s); disp.appendChild(s); }
  root.appendChild(disp);
  const keypad = el('div', 'row');
  const update = () => { slots.forEach((s, i) => s.textContent = val[i] || ''); };
  for (let n = 1; n <= 9; n++) {
    const k = el('button', 'key', String(n));
    k.onclick = () => { Sound.click(); if (val.length < answer.length) { val += String(n); update(); } };
    keypad.appendChild(k);
  }
  const del = el('button', 'key', '⌫'); del.onclick = () => { Sound.click(); val = val.slice(0, -1); update(); };
  const zero = el('button', 'key', '0'); zero.onclick = () => { Sound.click(); if (val.length < answer.length) { val += '0'; update(); } };
  const ok = el('button', 'key', '✓');
  ok.onclick = () => {
    if (val.length < answer.length) { onFail('Kode belum lengkap.'); return; }
    if (val === answer) onSolve();
    else { Sound.fail(); onFail('Kode salah. Coba lagi.'); val = ''; update(); }
  };
  keypad.appendChild(del); keypad.appendChild(zero); keypad.appendChild(ok);
  root.appendChild(keypad);
}

function buildOrder(root, items, onSolve, onFail, prompt) {
  const order = items.map((_, i) => i);
  const shuffled = order.slice();
  for (let i = shuffled.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]]; }
  let next = 0; const btns = [];
  const wrap = el('div', 'col');
  if (prompt) wrap.appendChild(el('div', 'cq', prompt));
  shuffled.forEach(idx => {
    const b = el('button', 'pbtn', items[idx]);
    b.onclick = () => {
      if (b.classList.contains('done')) return;
      if (idx === next) {
        Sound.click(); b.classList.add('good', 'done'); next++;
        if (next >= items.length) onSolve();
      } else {
        Sound.fail(); b.classList.add('bad'); setTimeout(() => b.classList.remove('bad'), 340);
        onFail('Urutan belum tepat. Mulai lagi dari awal.');
        next = 0; btns.forEach(x => x.classList.remove('good', 'done'));
      }
    };
    btns.push(b); wrap.appendChild(b);
  });
  root.appendChild(wrap);
}

function buildMatch(root, pairs, onSolve, onFail) {
  const lefts = pairs.map((p, i) => ({ txt: p.l, id: i }));
  const rights = pairs.map((p, i) => ({ txt: p.r, id: i }));
  const shuf = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
  const L = shuf(lefts), R = shuf(rights);
  let selL = null, done = 0;
  const row = el('div', 'two'); const colL = el('div', 'col'), colR = el('div', 'col');
  const lEls = [], rEls = [];
  L.forEach(o => {
    const b = el('button', 'pbtn', o.txt);
    b.onclick = () => {
      if (b.classList.contains('done')) return;
      Sound.click(); lEls.forEach(x => x.classList.remove('good')); b.classList.add('good'); selL = o.id;
    };
    lEls.push(b); colL.appendChild(b);
  });
  R.forEach(o => {
    const b = el('button', 'pbtn', o.txt);
    b.onclick = () => {
      if (b.classList.contains('done')) return;
      if (selL === null) { onFail('Pilih dulu bagian dari kolom kiri.'); return; }
      if (selL === o.id) {
        Sound.click(); b.classList.add('good', 'done');
        lEls.forEach(x => { if (x.textContent === pairs[o.id].l) x.classList.add('done'); });
        done++; selL = null;
        if (done >= pairs.length) onSolve();
      } else {
        Sound.fail(); b.classList.add('bad'); setTimeout(() => b.classList.remove('bad'), 340);
        onFail('Pasangan itu belum cocok.'); lEls.forEach(x => x.classList.remove('good')); selL = null;
      }
    };
    rEls.push(b); colR.appendChild(b);
  });
  row.appendChild(colL); row.appendChild(colR); root.appendChild(row);
}

function buildSelect(root, options, correctIdx, onSolve, onFail, prompt) {
  const wrap = el('div', 'col');
  if (prompt) wrap.appendChild(el('div', 'cq', prompt));
  options.forEach((txt, i) => {
    const b = el('button', 'pbtn', txt);
    b.onclick = () => {
      if (i === correctIdx) { b.classList.add('good'); onSolve(); }
      else { Sound.fail(); b.classList.add('bad'); setTimeout(() => b.classList.remove('bad'), 340); onFail('Bukan itu. Baca lagi bukti yang ada.'); }
    };
    wrap.appendChild(b);
  });
  root.appendChild(wrap);
}

function buildPath(root, grid, start, end, onSolve, onFail) {
  const N = grid.length; const cells = []; const g = el('div', 'pathgrid');
  const on = new Set(); on.add(start[0] + ',' + start[1]); on.add(end[0] + ',' + end[1]);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const c = el('div', 'cell');
    const isRock = grid[y][x] === '#';
    if (isRock) c.classList.add('rock');
    if (x === start[0] && y === start[1]) { c.classList.add('st'); c.textContent = 'S'; }
    else if (x === end[0] && y === end[1]) { c.classList.add('en'); c.textContent = 'E'; }
    if (!isRock) {
      c.onclick = () => {
        const key = x + ',' + y;
        if ((x === start[0] && y === start[1]) || (x === end[0] && y === end[1])) return;
        Sound.click();
        if (on.has(key)) { on.delete(key); c.classList.remove('on'); }
        else { on.add(key); c.classList.add('on'); }
      };
    }
    cells.push(c); g.appendChild(c);
  }
  root.appendChild(g);
  const br = el('div', 'btnrow');
  const check = el('button', 'gbtn', 'PERIKSA JALUR');
  check.onclick = () => {
    const seen = new Set(); const q = [[start[0], start[1]]];
    seen.add(start[0] + ',' + start[1]); let ok = false;
    while (q.length) {
      const [x, y] = q.shift();
      if (x === end[0] && y === end[1]) { ok = true; break; }
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx, ny = y + dy, k = nx + ',' + ny;
        if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
        if (grid[ny][nx] === '#') continue;
        if (!on.has(k) || seen.has(k)) continue;
        seen.add(k); q.push([nx, ny]);
      }
    }
    if (ok) onSolve();
    else { Sound.fail(); onFail('Jalurnya masih terputus. Satwa tidak bisa lewat.'); }
  };
  const clr = el('button', 'gbtn', 'BERSIHKAN');
  clr.onclick = () => {
    Sound.click(); on.clear();
    on.add(start[0] + ',' + start[1]); on.add(end[0] + ',' + end[1]);
    cells.forEach((c, i) => {
      const x = i % N, y = Math.floor(i / N), k = x + ',' + y;
      if (!on.has(k)) c.classList.remove('on');
    });
  };
  br.appendChild(clr); br.appendChild(check); root.appendChild(br);
}

function buildPhotoSwap(root, onSolve, onFail) {
  const cols = 3, rows = 2, N = cols * rows;
  let order = [0, 1, 2, 3, 4, 5];
  do { for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; } }
  while (order.every((v, i) => v === i));
  const grid = el('div', 'photogrid'); const canvases = []; let sel = -1;
  for (let i = 0; i < N; i++) {
    const c = D.createElement('canvas'); c.width = 60; c.height = 45;
    const cx = c.getContext('2d'); cx.imageSmoothingEnabled = false;
    canvases.push({ c, cx });
    c.onclick = () => {
      Sound.click();
      if (sel === -1) { sel = i; draw(); return; }
      if (sel === i) { sel = -1; draw(); return; }
      const tmp = order[sel]; order[sel] = order[i]; order[i] = tmp; sel = -1; draw();
      if (order.every((v, k) => v === k)) onSolve();
      else onFail('Masih ada potongan yang tertukar.');
    };
    grid.appendChild(c);
  }
  function draw() {
    canvases.forEach((o, i) => {
      const p = order[i];
      o.cx.setTransform(1, 0, 0, 1, 0, 0);
      o.cx.fillStyle = '#000'; o.cx.fillRect(0, 0, 60, 45);
      o.cx.save(); o.cx.translate(-(p % cols) * 60, -Math.floor(p / cols) * 45); drawPhoto(o.cx); o.cx.restore();
      o.c.classList.toggle('sel', i === sel);
    });
  }
  draw(); root.appendChild(grid);
}

/* ---- STEP ENGINE ---- */
function runStep() {
  const list = STORY[state.chapter];
  if (!list) { doEnding(); return; }
  if (state.step >= list.length) { endChapter(); return; }
  save();
  exec(list[state.step]);
}
function advance() { if (!state.started) return; state.step++; runStep(); }
function exec(s) {
  switch (s.t) {
    case 'card': showCard(s.n, s.title, s.sub, advance); break;
    case 'scene': state.scene = s.id; advance(); break;
    case 'narr': showNarr(s.who, s.txt, advance); break;
    case 'letter': addLetter(s.id); showLetter(s.id, advance); break;
    case 'puzzle': openPuzzle(s.id, () => { advance(); }); break;
    case 'choice': showChoice(s.q, s.opts); break;
    case 'explore': startExplore(s); break;
    case 'cut': playCut(s.id, advance); break;
    case 'end': doEnding(); break;
    default: advance();
  }
}
function startExplore(s) {
  state.hotspots = s.items.map(i => ({ x: i.x, y: i.y, r: i.r, label: i.label, txt: i.txt, found: false }));
  state.exploreNeed = s.need || s.items.length;
  $('#exploreHint').classList.remove('hide');
  hideText();
}
function endChapter() {
  if (state.chapter < 8) { state.chapter++; state.step = 0; save(); runStep(); }
  else doEnding();
}
function showCard(n, title, sub, cb) {
  const c = $('#card');
  c.querySelector('.n').textContent = n;
  c.querySelector('.t').textContent = title;
  c.querySelector('.s').textContent = sub || '';
  c.classList.remove('hide'); c.style.opacity = '1';
  hideText();
  $('#hud').classList.remove('hide');
  $('#chLabel').textContent = n + ' · ' + title;
  Sound.low();
  setTimeout(() => {
    c.style.opacity = '0';
    setTimeout(() => { c.classList.add('hide'); c.style.opacity = '1'; cb(); }, 700);
  }, 2400);
}

function computeEnding() {
  const allLetters = state.letters.length >= 6;
  const allPuzzles = state.puzzles.length >= 13;
  const p = state.flags.publish;
  if (p === 'bury' || !p) return 'kubur';
  if (allLetters && allPuzzles && p === 'publish') return 'secret';
  if (p === 'publish' && state.trust < 3) return 'mahal';
  if (state.env >= 3 && state.trust >= 4) return 'benih';
  return 'tanpa';
}

function doEnding(id) {
  hideText(); $('#choices').classList.add('hide'); $('#hud').classList.add('hide');
  const key = id || computeEnding();
  if (!state.endings.includes(key)) state.endings.push(key);
  const E = ENDINGS[key];
  save();
  const ov = $('#overlay'); ov.innerHTML = '';
  const m = el('div', 'modal');
  m.appendChild(el('h2', null, 'ENDING — ' + E.title));
  const p = el('div', 'cred');
  E.text.split('\n\n').forEach(par => { const d = el('div', null, par); d.style.marginBottom = '14px'; p.appendChild(d); });
  m.appendChild(p);
  const stats = el('div', 'endstat');
  stats.innerHTML = 'Surat ditemukan: ' + state.letters.length + ' / 6<br>' +
    'Teka-teki terpecahkan: ' + state.puzzles.length + ' / 13<br>' +
    'Bukti terkumpul: ' + state.evidence + '<br>' +
    'Kepercayaan warga: ' + Math.max(0, state.trust) + '<br>' +
    'Kondisi lingkungan: ' + Math.max(0, state.env) + '<br>' +
    'Ending terbuka: ' + state.endings.length + ' / 5';
  m.appendChild(stats);
  const br = el('div', 'btnrow');
  const b1 = el('button', 'gbtn', 'KEMBALI KE MENU');
  b1.onclick = () => { Sound.click(); ov.classList.add('hide'); ov.innerHTML = ''; showMenu(); };
  br.appendChild(b1); m.appendChild(br); ov.appendChild(m); ov.classList.remove('hide');
  Sound.piano(196, 5, 0, 0.1);
}

    settings.music = !settings.music;
    Sound.musicOn = settings.music;
    if (Sound.musicGain) Sound.musicGain.gain.value = settings.music ? 0.22 : 0;
    b3.textContent = settings.music ? 'HIDUP' : 'MATI';
    b3.classList.toggle('on', settings.music); Sound.click();
  };
  r3.appendChild(b3); m.appendChild(r3);

  const r4 = el('div', 'setrow'); r4.appendChild(el('span', null, 'Kecepatan teks'));
  const s4 = D.createElement('input');
  s4.type = 'range'; s4.min = '12'; s4.max = '120'; s4.step = '2'; s4.value = String(settings.textSpeed);
  s4.oninput = () => { settings.textSpeed = parseInt(s4.value, 10); };
  r4.appendChild(s4); m.appendChild(r4);

  const r5 = el('div', 'setrow'); r5.appendChild(el('span', null, 'Kurangi animasi'));
  const b5 = el('button', 'toggle' + (settings.reduceMotion ? ' on' : ''), settings.reduceMotion ? 'HIDUP' : 'MATI');
  b5.onclick = () => {
    settings.reduceMotion = !settings.reduceMotion;
    b5.textContent = settings.reduceMotion ? 'HIDUP' : 'MATI';
    b5.classList.toggle('on', settings.reduceMotion); Sound.click();
  };
  r5.appendChild(b5); m.appendChild(r5);

  const r6 = el('div', 'setrow'); r6.appendChild(el('span', null, 'Hapus progres tersimpan'));
  const b6 = el('button', 'toggle', 'HAPUS');
  b6.onclick = () => {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    b6.textContent = 'DIHAPUS'; b6.classList.add('on');
    setTimeout(() => { b6.textContent = 'HAPUS'; b6.classList.remove('on'); }, 1600);
  };
  r6.appendChild(b6); m.appendChild(r6);

  if (!storageOK) {
    const w = el('div', 'hint', 'Penyimpanan tidak tersedia di browser ini. Game tetap bisa dimainkan, tetapi progres tidak akan tersimpan.');
    w.style.marginTop = '14px'; m.appendChild(w);
  }
  ov.appendChild(m); ov.classList.remove('hide');
}

function showPause() {
  const ov = $('#overlay'); ov.innerHTML = '';
  const m = el('div', 'modal');
  const closeB = el('button', 'close', '×');
  closeB.onclick = () => { Sound.click(); closeOverlay(); };
  m.appendChild(closeB);
  m.appendChild(el('h2', null, 'Jeda'));
  m.appendChild(el('div', 'hint', 'Bab ' + state.chapter + ' dari 8 · Surat ' + state.letters.length + '/6 · Teka-teki ' + state.puzzles.length + '/13'));
  const br = el('div', 'btnrow');
  const b1 = el('button', 'gbtn', 'LANJUTKAN');
  b1.onclick = () => { Sound.click(); closeOverlay(); };
  const b2 = el('button', 'gbtn', 'PENGATURAN');
  b2.onclick = () => { Sound.click(); showSettings(); };
  const b3 = el('button', 'gbtn', 'ARSIP SURAT');
  b3.onclick = () => { Sound.click(); showArchive(); };
  const b4 = el('button', 'gbtn', 'MENU UTAMA');
  b4.onclick = () => { Sound.click(); closeOverlay(); save(); showMenu(); };
  br.appendChild(b1); br.appendChild(b2); br.appendChild(b3); br.appendChild(b4);
  m.appendChild(br); ov.appendChild(m); ov.classList.remove('hide');
}

function showCredits() {
  const ov = $('#overlay'); ov.innerHTML = '';
  const m = el('div', 'modal');
  const closeB = el('button', 'close', '×');
  closeB.onclick = () => { Sound.click(); closeOverlay(); };
  m.appendChild(closeB);
  m.appendChild(el('h2', null, 'Kredit'));
  const p = el('div', 'cred');
  p.innerHTML = '<b>SURAT TERAKHIR DARI HUTAN</b><br><br>' +
    'Sebuah kisah fiksi tentang hutan, angka, dan orang-orang yang tinggal di antaranya.<br><br>' +
    'Seluruh visual dibuat secara prosedural dengan Canvas 2D.<br>' +
    'Seluruh audio dibuat secara prosedural dengan Web Audio API.<br>' +
    'Tidak ada aset eksternal, gambar, font, atau suara dari internet.<br><br>' +
    'Semua tokoh, desa, perusahaan, dan peristiwa dalam cerita ini adalah fiktif. ' +
    'Kemiripan dengan kejadian nyata adalah kebetulan — atau mungkin bukan, ' +
    'karena cerita ini memang tentang sesuatu yang terjadi di banyak tempat.<br><br>' +
    '<b>Terima kasih telah mendengarkan.</b>';
  m.appendChild(p); ov.appendChild(m); ov.classList.remove('hide');
}

/* ---- INPUT ---- */
window.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') {
    if (!tbEl.classList.contains('hide')) { e.preventDefault(); tbEl.click(); }
  }
  if (e.key === 'Escape') {
    const ov = $('#overlay');
    if (!ov.classList.contains('hide')) { if ($('#menu').classList.contains('hide')) closeOverlay(); }
    else if ($('#menu').classList.contains('hide') && state.started) showPause();
  }
});
D.addEventListener('touchstart', () => Sound.resume(), { once: true });
D.addEventListener('click', () => Sound.resume(), { once: true });

/* ---- BOOT ---- */
resize();
showMenu();
requestAnimationFrame(render);
setTimeout(() => { resize(); }, 50);
window.addEventListener('load', resize);
</script>
